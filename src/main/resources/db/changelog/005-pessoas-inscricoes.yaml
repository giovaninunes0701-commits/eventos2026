databaseChangeLog:
  - changeSet:
      id: 005-01-pessoas-participantes-inscricoes
      author: giovani-aula10
      changes:
        - createTable:
            tableName: pessoa
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: nome, type: VARCHAR(120), constraints: {nullable: false}}
              - column: {name: email, type: VARCHAR(150), constraints: {nullable: false}}
              - column: {name: cpf, type: VARCHAR(11), constraints: {nullable: false}}

        - addUniqueConstraint: {tableName: pessoa, columnNames: email, constraintName: uk_pessoa_email}
        - addUniqueConstraint: {tableName: pessoa, columnNames: cpf, constraintName: uk_pessoa_cpf}

        - createTable:
            tableName: participante
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: pessoa_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: telefone, type: VARCHAR(30)}

        - addUniqueConstraint: {tableName: participante, columnNames: pessoa_id, constraintName: uk_participante_pessoa}
        - addForeignKeyConstraint: {baseTableName: participante, baseColumnNames: pessoa_id, referencedTableName: pessoa, referencedColumnNames: id, constraintName: fk_participante_pessoa}

        - createTable:
            tableName: inscricao
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: participante_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: evento_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: status, type: VARCHAR(20), constraints: {nullable: false}}

        - addUniqueConstraint: {tableName: inscricao, columnNames: "participante_id, evento_id", constraintName: uk_inscricao_participante_evento}
        - addForeignKeyConstraint: {baseTableName: inscricao, baseColumnNames: participante_id, referencedTableName: participante, referencedColumnNames: id, constraintName: fk_inscricao_participante}
        - addForeignKeyConstraint: {baseTableName: inscricao, baseColumnNames: evento_id, referencedTableName: evento, referencedColumnNames: id, constraintName: fk_inscricao_evento}
        - sql:
            sql: "ALTER TABLE inscricao ADD CONSTRAINT ck_inscricao_status CHECK (status IN ('SOLICITADA','CONFIRMADA','CANCELADA'))"
      rollback:
        - dropTable: {tableName: inscricao}
        - dropTable: {tableName: participante}
        - dropTable: {tableName: pessoa}
