databaseChangeLog:
  - changeSet:
      id: 001-01-create-categoria-evento
      author: giovani-eventos2026
      comment: Cria a tabela que classifica os eventos.
      changes:
        - createTable:
            tableName: categoria_evento
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categoria_evento
                    nullable: false
              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: categoria_evento

  - changeSet:
      id: 001-02-check-status-categoria-evento
      author: giovani-eventos2026
      comment: Restringe o status aos valores definidos no enum Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE categoria_evento
              ADD CONSTRAINT ck_categoria_evento_status
              CHECK (status IN ('ATIVO', 'INATIVO'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE categoria_evento
              DROP CONSTRAINT ck_categoria_evento_status
