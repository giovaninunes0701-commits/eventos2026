spring.application.name=eventos2026
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventos2026_dev}
spring.datasource.username=${DB_USERNAME:eventos_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.config.import=optional:file:.env[.properties]
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Aula 13 - JWT
app.security.jwt.issuer=https://eventos2026.local
app.security.jwt.expiration=PT30M
app.security.jwt.secret=${JWT_SECRET}
